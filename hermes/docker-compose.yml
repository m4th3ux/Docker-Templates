# ==========================================
# HERMES AGENT (Nous Research) — Homelab
# ==========================================
# Agente de IA self-hosted com gateway de mensagens (Telegram + Discord).
# Inferência 100% via APIs externas — NÃO usa GPU nem modelos locais.
#
# Uso:
#   cp example.env .env          # preencha as chaves
#   docker compose up -d
#
# Configuração inicial (uma única vez):
#   docker exec -it hermes hermes model          # escolher provedor/modelo LLM
#   docker exec -it hermes hermes gateway setup  # conectar Telegram/Discord
#   docker compose restart
#
# Imagem oficial publicada no Docker Hub (sem build local):
#   https://hub.docker.com/r/nousresearch/hermes-agent
# Docs: https://hermes-agent.nousresearch.com/docs/

services:
  # ---- Gateway de mensagens (Telegram, Discord, cron, etc.) -----------------
  gateway:
    image: nousresearch/hermes-agent:stable
    container_name: hermes
    restart: unless-stopped
    # Host network: o gateway pode abrir portas de webhook por plataforma
    # (Slack, Teams, Telegram webhook etc.) sem conflito de mapeamento.
    # Telegram (long polling) e Discord (websocket) funcionam sem porta aberta.
    network_mode: host
    env_file: .env
    environment:
      # UID/GID do host dono dos arquivos no volume (ver example.env)
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
      - TZ=${TZ:-America/Sao_Paulo}
    volumes:
      # Estado, memória, skills, sessões e logs ficam em volume nomeado
      - hermes_data:/opt/data
    command: ["gateway", "run"]

    # ---- OPCIONAL: segredos via Infisical + backend SSH no host -------------
    # Descomente para: buscar senhas do Infisical no boot do container
    # (script cont-init do s6-overlay) e usar o HOST como terminal do agente.
    #   1. cp fetch-secrets.sh.example fetch-secrets.sh   # ajuste o mapa
    #   2. gere uma chave SSH e adicione a pub em ~/.ssh/authorized_keys do host
    #   3. exporte a CA do seu Infisical (infisical-ca.crt) para esta pasta
    #   4. preencha INFISICAL_* no .env
    # environment:
    #   - INFISICAL_DOMAIN=${INFISICAL_DOMAIN:-https://seu-infisical}
    #   - INFISICAL_CLIENT_ID=${INFISICAL_CLIENT_ID}
    #   - INFISICAL_CLIENT_SECRET=${INFISICAL_CLIENT_SECRET}
    #   - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID}
    #   - INFISICAL_ENVIRONMENT=${INFISICAL_ENVIRONMENT:-dev}
    #   - INFISICAL_CA_FILE=/opt/hermes/ca/infisical-ca.crt
    # volumes:
    #   - ./fetch-secrets.sh:/etc/cont-init.d/05-fetch-secrets.sh:ro,Z
    #   - ./infisical-ca.crt:/opt/hermes/ca/infisical-ca.crt:ro,Z
    # No .env (host): TERMINAL_ENV=ssh, TERMINAL_SSH_KEY=~/.ssh/id_ed25519
    # MCPs com auth vinda do Infisical (via ${VAR} resolvido em runtime):
    #   docker exec --user 1000:1000 hermes hermes config set mcp_servers \
    #     '{"obsidian":{"url":"${OBSIDIAN_MCP_URL}","headers":{"Authorization":"${OBSIDIAN_MCP_AUTH_HEADER}"}}}'

  # ---- Dashboard web (OPCIONAL — descomente para usar) ----------------------
  # Armazena chaves de API: por padrão só escuta em 127.0.0.1.
  # Acesse via túnel SSH (ssh -L 9119:localhost:9119 user@homelab).
  # NÃO exponha na LAN/internet sem autenticação.
  # dashboard:
  #   image: nousresearch/hermes-agent:stable
  #   container_name: hermes-dashboard
  #   restart: unless-stopped
  #   network_mode: host
  #   depends_on:
  #     - gateway
  #   environment:
  #     - HERMES_UID=${HERMES_UID:-10000}
  #     - HERMES_GID=${HERMES_GID:-10000}
  #   volumes:
  #     - hermes_data:/opt/data
  #   command: ["dashboard", "--host", "127.0.0.1", "--no-open"]

volumes:
  # Volume EXTERNO: criado fora do compose (no host ou via Portainer) e
  # gerenciado por você — o compose não o recria nem o apaga no `down -v`.
  # Antes do primeiro `up`, crie com:  docker volume create hermes_data
  hermes_data:
    external: true
